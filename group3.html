<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지각띠 — 출석 자동 저장</title><style>body{margin:0;background:#f1f6ff;color:#22314d;font-family:system-ui,'Noto Sans KR',sans-serif}main{max-width:760px;margin:25px auto;padding:20px}header{text-align:center}h1{font-size:clamp(34px,7vw,55px);margin:5px}p{color:#63718a}.panel{background:white;border-radius:24px;padding:24px;box-shadow:0 8px 30px #1b407016}.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin-top:20px}button{border:0;border-radius:15px;background:#e9efff;color:#22314d;padding:16px 12px;font-size:18px;font-weight:750;cursor:pointer}button:focus-visible{outline:3px solid #425eea}.names button.status-green{background:#d9f7e3;color:#176534;border:2px solid #55bd78}.names button.status-yellow{background:#fff0ad;color:#805900;border:2px solid #e8c84b}.names button.status-red{background:#ffdede;color:#a61f2b;border:2px solid #ef777e}button:active{transform:scale(.97)}.primary{background:#3c63e9;color:white;width:100%;margin-top:15px}.screen{display:none}.screen.active{display:block}.big{font-size:clamp(50px,14vw,110px);margin:16px 0}.result{text-align:center;padding:20px;border-radius:24px}.green{background:#e0f8e8}.yellow{background:#fff5c7}.red{background:#ffe1e1}.time{font-size:24px;font-weight:800}.muted{font-size:14px}.notice{background:#f5f7fc;padding:12px;border-radius:12px;font-size:14px}.namebox{display:flex;gap:8px}.namebox input{flex:1;min-width:0;border:1px solid #ccd6e6;border-radius:12px;padding:12px;font-size:16px}.namebox button{font-size:15px}#msg{min-height:22px;color:#ba3535}.arrival-list{list-style:none;padding:0;text-align:left;max-width:440px;margin:20px auto}.arrival-list li{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid #e2e8f0;border-radius:8px}.arrival-list li.me{background:#e9efff;font-weight:800}.arrival-list time{white-space:nowrap;color:#52627b}.history-panel{margin-top:22px;padding-top:16px;border-top:2px solid #e7edf8}.history-empty{color:#7b879b;text-align:center;padding:12px}.history-count{font-size:14px;color:#63718a} .dancer{font-size:clamp(65px,18vw,130px);display:inline-block;transform-origin:center bottom;animation:none}.dancer.green,.dancer.yellow,.dancer.red{background:none}@keyframes badMove{0%{transform:translateY(0) rotate(-12deg) scale(1)}12%{transform:translate(-12px,-18px) rotate(18deg) scale(1.1)}25%{transform:translate(16px,0) rotate(-22deg) skewX(-8deg)}37%{transform:translate(0,-22px) rotate(8deg) scale(1.12)}50%{transform:translate(-18px,0) rotate(25deg)}62%{transform:translate(14px,-10px) rotate(-16deg)}75%{transform:translate(0,4px) rotate(0) scale(.9,1.08)}87%{transform:translate(0,-25px) rotate(14deg) scale(1.12)}100%{transform:translateY(0) rotate(-12deg)}}.stage{min-height:160px;display:flex;align-items:center;justify-content:center;gap:12px}.spark{font-size:32px;animation:none}.spark:last-child{animation:none}@keyframes beat{to{transform:translateY(-18px) scale(1.2) rotate(20deg)}}@media(prefers-reduced-motion:reduce){.dancer,.spark{animation:none}} </style></head><body><main><header><h1>⏰ 지각띠</h1><p>내 번호를 누르면 오늘의 반응과 순위를 확인할 수 있어요!</p></header><section id="one" class="screen active panel"><h2>① 내 번호 누르기</h2><p>번호를 누르면 지금 시각에 따라 반응이 나와요. 오늘 처음 누른 시각이 자동 저장돼요.</p><div class="names" id="names"></div><h3 style="display:none">이름 추가</h3><div class="namebox" style="display:none"><input id="newName" aria-label="추가할 이름" maxlength="15" placeholder="학생 이름"><button id="add">추가</button></div><p id="msg" role="status"></p><p class="notice">출석 시각과 도착 순서는 이 기기에 자동 저장돼요. 같은 날 다시 눌러도 첫 시각이 유지됩니다. 다른 기기와 기록을 공유하지 않습니다.</p><div class="history-panel"><h2>📋 오늘의 출석 기록</h2><p id="historyCount" class="history-count"></p><ol id="historyList" class="arrival-list"></ol></div></section><section id="two" class="screen panel"><h2>② 오늘의 반응</h2><div id="result" class="result"><div class="stage"><span class="spark">✨</span><div id="emoji" class="dancer" aria-label="BAD 스타일 춤추는 캐릭터"></div><span class="spark">🎵</span></div><h2 id="phrase"></h2><p id="arrival" class="time"></p><p id="detail"></p></div><button class="primary" id="next">내 도착 순서 보기 →</button></section><section id="three" class="screen panel" style="text-align:center"><h2>③ 내 도착 순서</h2><div class="stage"><span class="spark">🎶</span><div class="dancer">🕺</div><span class="spark">✨</span></div><h2 id="rank"></h2><p id="rankInfo"></p><h3>온 순서대로</h3><ol id="arrivalList" class="arrival-list"></ol><button class="primary" id="home">다른 이름 선택하기</button></section></main><script>
const initial=Array.from({length:24},(_,i)=>`${i+1}번 학생`);const STORAGE_KEY='jigaktti-exhibit-v1';
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let names=[...initial],order=[],arrivals={},current='';
function loadSaved(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const data=JSON.parse(raw);if(Array.isArray(data.names))names=[...new Set([...initial,...data.names.filter(x=>typeof x==='string'&&x.trim().length<=15)])];if(data.date===today()&&Array.isArray(data.order)&&data.arrivals&&typeof data.arrivals==='object'){order=data.order.filter(n=>names.includes(n)&&Number.isFinite(Date.parse(data.arrivals[n])));arrivals=Object.fromEntries(order.map(n=>[n,new Date(data.arrivals[n])]));}}catch(e){console.warn('저장된 출석 기록을 불러오지 못했습니다.',e);$('msg').textContent='이전에 저장한 기록을 불러오지 못했어요.';}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({date:today(),names,order,arrivals:Object.fromEntries(order.map(n=>[n,arrivals[n].toISOString()]))}));return true}catch(e){console.warn('출석 기록 저장 실패',e);$('msg').textContent='기록을 저장하지 못했어요. 브라우저 저장 공간이나 개인정보 보호 설정을 확인해 주세요.';return false}}
const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}function render(){const root=$('names');root.replaceChildren();names.forEach(name=>{let b=document.createElement('button');b.textContent=name;const status=getNameStatus(name);if(status)b.classList.add('status-'+status);b.onclick=()=>{check(name);updateNameColors();showRank(name)};root.appendChild(b)});renderHistory()}function getNameStatus(name){if(!order.includes(name)||!arrivals[name])return '';const d=arrivals[name],m=d.getHours()*60+d.getMinutes();if(m>=520)return 'red';if(m>=510)return 'yellow';return 'green'}function updateNameColors(){document.querySelectorAll('#names button').forEach(b=>{const status=getNameStatus(b.textContent);b.classList.remove('status-green','status-yellow','status-red');if(status)b.classList.add('status-'+status)})}function renderHistory(){const list=$('historyList');if(!list)return;list.replaceChildren();const sorted=[...order].sort((a,b)=>arrivals[a]-arrivals[b]);$('historyCount').textContent='오늘 '+sorted.length+'명 기록됨 · 이름을 누른 순서대로 자동 저장';if(!sorted.length){const empty=document.createElement('li');empty.className='history-empty';empty.textContent='아직 기록이 없어요. 번호를 누르면 여기에 기록돼요.';list.appendChild(empty);return}sorted.forEach((name,i)=>{const li=document.createElement('li');const label=document.createElement('span');label.textContent=(i+1)+'번째 · '+name;const time=document.createElement('time');time.textContent=arrivals[name].toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});li.append(label,time);list.appendChild(li)})}function speak(s){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=.92;u.pitch=1.18;const voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ko'));u.voice=voices.find(v=>/female|여성|heami|yuna|sunhi/i.test(v.name))||voices[0]||null;speechSynthesis.speak(u)}function check(name){current=name;if(!order.includes(name)){order.push(name);arrivals[name]=new Date();save()}renderHistory();updateNameColors();let d=arrivals[name],m=d.getHours()*60+d.getMinutes(),time=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});let emoji,phrase,detail,cls,voice;if(m<510){emoji='🕺';phrase='소 굿!';detail='아주 잘했어요!';cls='green';voice='소 굿!'}else if(m<=520){emoji='💃';phrase='야르!';detail='조금만 더 일찍 와요!';cls='yellow';voice='야르!'}else{emoji='🕺';phrase=name+' 학생 지각했어요!';detail=(m>540?'9시 이후예요. ':'')+'8시 40분 기준 '+Math.max(1,m-520)+'분 지각';cls='red';voice=name+' 학생 지각했어요!'}$('emoji').textContent=emoji;$('phrase').textContent=phrase;$('arrival').textContent='첫 도착 기록 '+time;$('detail').textContent=detail;$('result').className='result '+cls;show('two');speak(voice)}function showRank(name){const sorted=[...order].sort((a,b)=>arrivals[a]-arrivals[b]);$('rank').textContent=name+' 학생은 '+(sorted.indexOf(name)+1)+'번째로 눌렀어요!';$('rankInfo').textContent='이 기기에서 이름을 처음 누른 시각순이에요. 실제 학급 전체 순위는 아니에요.';const list=$('arrivalList');list.replaceChildren();sorted.forEach((person,i)=>{const li=document.createElement('li');if(person===name)li.className='me';const label=document.createElement('span');label.textContent=(i+1)+'번째 · '+person;const time=document.createElement('time');time.textContent=arrivals[person].toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});li.append(label,time);list.append(li)});show('three')}$('next').onclick=()=>showRank(current);$('home').onclick=()=>show('one');$('add').onclick=()=>{let name=$('newName').value.trim();if(!name){$('msg').textContent='이름을 입력해 주세요.';return}if(names.includes(name)){$('msg').textContent='이미 있는 이름이에요.';return}names.push(name);$('newName').value='';$('msg').textContent=save()?'이름이 저장됐어요.':'이름은 추가됐지만 저장하지 못했어요.';render()};loadSaved();render();renderHistory();</script></body></html>
