<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지각띠</title><style>body{margin:0;background:#f1f6ff;color:#22314d;font-family:system-ui,'Noto Sans KR',sans-serif}main{max-width:760px;margin:25px auto;padding:20px}header{text-align:center}h1{font-size:clamp(34px,7vw,55px);margin:5px}p{color:#63718a}.panel{background:white;border-radius:24px;padding:24px;box-shadow:0 8px 30px #1b407016}.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin-top:20px}button{border:0;border-radius:15px;background:#e9efff;color:#22314d;padding:16px 12px;font-size:18px;font-weight:750;cursor:pointer}button:focus-visible{outline:3px solid #425eea}button:active{transform:scale(.97)}.primary{background:#3c63e9;color:white;width:100%;margin-top:15px}.screen{display:none}.screen.active{display:block}.big{font-size:clamp(50px,14vw,110px);margin:16px 0}.result{text-align:center;padding:20px;border-radius:24px}.green{background:#e0f8e8}.yellow{background:#fff5c7}.red{background:#ffe1e1}.time{font-size:24px;font-weight:800}.muted{font-size:14px}.notice{background:#f5f7fc;padding:12px;border-radius:12px;font-size:14px}.namebox{display:flex;gap:8px}.namebox input{flex:1;min-width:0;border:1px solid #ccd6e6;border-radius:12px;padding:12px;font-size:16px}.namebox button{font-size:15px}#msg{min-height:22px;color:#ba3535}.arrival-list{list-style:none;padding:0;text-align:left;max-width:440px;margin:20px auto}.arrival-list li{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid #e2e8f0;border-radius:8px}.arrival-list li.me{background:#e9efff;font-weight:800}.arrival-list time{white-space:nowrap;color:#52627b}</style></head><body><main><header><h1>⏰ 지각띠</h1><p>내 이름을 누르고 오늘의 반응을 확인해요!</p></header><section id="one" class="screen active panel"><h2>① 내 이름 누르기</h2><p>이름을 누르면 지금 시각에 따라 반응이 나와요.</p><div class="names" id="names"></div><h3>이름 추가</h3><div class="namebox"><input id="newName" aria-label="추가할 이름" maxlength="15" placeholder="학생 이름"><button id="add">추가</button></div><p id="msg" role="status"></p><p class="notice">기록을 저장하지 않는 버전이에요. 이름과 도착 순서는 페이지를 새로 열면 초기화됩니다. 다른 기기와 도착 순서를 공유하지 않습니다.</p></section><section id="two" class="screen panel"><h2>② 오늘의 반응</h2><div id="result" class="result"><div id="emoji" class="big"></div><h2 id="phrase"></h2><p id="arrival" class="time"></p><p id="detail"></p></div><button class="primary" id="next">내 도착 순서 보기 →</button></section><section id="three" class="screen panel" style="text-align:center"><h2>③ 내 도착 순서</h2><div class="big">🏅</div><h2 id="rank"></h2><p id="rankInfo"></p><h3>온 순서대로</h3><ol id="arrivalList" class="arrival-list"></ol><button class="primary" id="home">다른 이름 선택하기</button></section></main><script>
const initial=['김민재','김승현','김지우','김지현','김홍빈','나율','류다윤','박다민','박승유','박예나','박준후','박하율','송예준','송하윤','안태은','오승민','오윤서','이지이','조우영','편나연','편수민','한준서','황지한','황희준'];let names=[...initial],order=[],arrivals={},current='';const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}function render(){const root=$('names');root.replaceChildren();names.forEach(name=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>check(name);root.appendChild(b)})}function speak(s){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=.92;u.pitch=1.18;const voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ko'));u.voice=voices.find(v=>/female|여성|heami|yuna|sunhi/i.test(v.name))||voices[0]||null;speechSynthesis.speak(u)}function check(name){current=name;if(!order.includes(name)){order.push(name);arrivals[name]=new Date()}let d=new Date(),m=d.getHours()*60+d.getMinutes(),time=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});let emoji,phrase,detail,cls,voice;if(m<510){emoji='👍';phrase='소 굿!';detail='아주 잘했어요!';cls='green';voice='소 굿!'}else if(m<=520){emoji='✌️';phrase='야르!';detail='조금만 더 일찍 와요!';cls='yellow';voice='야르!'}else{emoji='👉';phrase=name+' 학생 지각했어요!';detail=(m>540?'9시 이후예요. ':'')+'8시 40분 기준 '+Math.max(1,m-520)+'분 지각';cls='red';voice=name+' 학생 지각했어요!'}$('emoji').textContent=emoji;$('phrase').textContent=phrase;$('arrival').textContent='확인 시각 '+time;$('detail').textContent=detail;$('result').className='result '+cls;show('two');speak(voice)}$('next').onclick=()=>{const sorted=[...order].sort((a,b)=>arrivals[a]-arrivals[b]);$('rank').textContent=current+' 학생은 '+(sorted.indexOf(current)+1)+'번째로 눌렀어요!';$('rankInfo').textContent='이 기기에서 이름을 처음 누른 시각순이에요. 실제 학급 전체 순위는 아니에요.';const list=$('arrivalList');list.replaceChildren();sorted.forEach((name,i)=>{const li=document.createElement('li');if(name===current)li.className='me';const label=document.createElement('span');label.textContent=(i+1)+'번째 · '+name;const time=document.createElement('time');time.textContent=arrivals[name].toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});li.append(label,time);list.append(li)});show('three')};$('home').onclick=()=>show('one');$('add').onclick=()=>{let name=$('newName').value.trim();if(!name){$('msg').textContent='이름을 입력해 주세요.';return}if(names.includes(name)){$('msg').textContent='이미 있는 이름이에요.';return}names.push(name);$('newName').value='';$('msg').textContent='이름이 추가됐어요. 새로고침하면 사라져요.';render()};render();</script></body></html>
