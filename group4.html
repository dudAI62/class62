<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1인1역 검사기</title>
<style>
:root{--ink:#783d59;--green:#ffd6e7;--green-dark:#c45b8c;--paper:#fff0f6;--line:#f2b9d0;--gold:#ffe0ed}
*{box-sizing:border-box}
body{margin:0;background:#ffeaf3;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5;transition:background .35s ease}
body.all-dirty{background:#e3c09b;color:#68401f}
body.all-dirty header{background:#d5a879;border-color:#9b6b3e}
body.all-dirty h1{color:#70431f}
body.all-dirty .kicker{color:#70431f}
body.all-dirty .counter{background:#f0d7b8;border-color:#a87545;color:#70431f}
body.all-dirty .sheet{background:#f2dfc7;border-color:#c69a6c;box-shadow:0 4px 0 #d0ad84}
body.all-dirty .progress-label{color:#70431f}
body.all-dirty #percent{color:#80502b;text-shadow:0 2px 0 #f8e7d1}
body.all-dirty .progress-wrap{border-color:#a87545;background:#ead0ae;box-shadow:inset 0 2px 3px #d7b48b}
body.all-dirty .progress{background:linear-gradient(90deg,#c58b54,#80502b)}
body.all-dirty footer{color:#70431f}
body.all-done{background:#72c8ff;color:#075985}
body.all-done header{background:#bfe8ff;border-color:#269bd3}
body.all-done h1{color:#005b96 !important}
body.all-done .kicker{color:#075985}
body.all-done .counter{background:#dff4ff;border-color:#269bd3;color:#075985}
body.all-done .sheet{background:#eaf8ff;border-color:#7bc9f2;box-shadow:0 4px 0 #9edcff}
body.all-done .progress-label{color:#075985}
body.all-done #percent{color:#005b96 !important;text-shadow:0 2px 0 #c7edff}
body.all-done .progress-wrap{border-color:#269bd3;background:#d7f0ff;box-shadow:inset 0 2px 3px #a8def8}
body.all-done .progress{background:linear-gradient(90deg,#64c7ff,#087cc1)}
body.all-done footer{color:#075985}
.background-dirt{display:block;position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.background-dirt>span{position:absolute;display:block;opacity:.88;filter:drop-shadow(0 2px 2px #69452b33);transition:opacity .45s ease,transform .45s ease;transform:scale(1);pointer-events:none}
.background-dirt>span.gone{opacity:0;transform:scale(.12) rotate(160deg)}
.background-dirt .poop-mark{font-size:clamp(19px,2.7vw,31px);line-height:1;filter:drop-shadow(0 2px 2px #52331e66)}
.background-dirt .trash-mark{font-size:clamp(17px,2.25vw,26px);line-height:1;filter:grayscale(.72) contrast(1.08) drop-shadow(1px 3px 2px #2228);opacity:.94}
.background-dirt .oil-mark{font-size:clamp(25px,3.5vw,39px);line-height:1;filter:drop-shadow(0 2px 2px #2228);opacity:.98;isolation:isolate} .background-dirt .oil-mark::before{content:"";position:absolute;z-index:-1;left:-12px;bottom:-5px;width:calc(100% + 24px);height:12px;background:radial-gradient(ellipse at 30% 50%,#111 0 28%,#292929 45%,#080808 72%,transparent 75%);border-radius:50%;transform:rotate(-8deg)} .background-dirt .oil-mark::after{content:"";position:absolute;z-index:-1;left:42%;top:62%;width:9px;height:21px;background:linear-gradient(90deg,#080808,#343434 45%,#050505);border-radius:3px 3px 8px 8px;transform:rotate(27deg);box-shadow:8px 13px 0 -2px #111,15px 19px 0 -4px #222}
.background-dirt .smoke-mark{font-size:clamp(21px,3vw,34px);line-height:1;opacity:.78;filter:grayscale(1) blur(.2px) drop-shadow(0 2px 2px #5554)}
.background-dirt .dust-cloud{width:34px;height:24px;opacity:.82;background:radial-gradient(ellipse at 18% 70%,#777 0 15%,transparent 17%),radial-gradient(ellipse at 36% 43%,#9a9a9a 0 20%,transparent 22%),radial-gradient(ellipse at 58% 63%,#686868 0 23%,transparent 25%),radial-gradient(ellipse at 78% 43%,#aaa 0 17%,transparent 19%),radial-gradient(ellipse at 53% 83%,#888 0 17%,transparent 19%);filter:blur(.45px) drop-shadow(0 2px 2px #5553)}
.background-dirt .dust-cloud::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;left:4px;top:-3px;background:#888;box-shadow:13px -4px 0 -1px #aaa,24px 1px 0 -2px #666,9px 19px 0 -2px #777}
main{position:relative;z-index:2}
.poop-flash{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden;display:none}
.poop-flash.show{display:block}
.poop-rocket{position:absolute;left:var(--x);bottom:-70px;font-size:clamp(28px,5vw,54px);filter:drop-shadow(0 3px 3px #69402a66);animation:poopLaunch 1s cubic-bezier(.2,.65,.25,1) var(--delay) forwards}
@keyframes poopLaunch{0%{transform:translate(0,0) rotate(0) scale(.5);opacity:0}12%{opacity:1}75%{opacity:1}100%{transform:translate(var(--drift),calc(-1 * var(--height))) rotate(var(--spin)) scale(1.15);opacity:0}}
.poop-particle{position:absolute;left:var(--x);top:var(--y);font-size:clamp(23px,4vw,45px);filter:drop-shadow(0 3px 3px #69402a66);animation:poopBurst 1.5s ease-out var(--delay) forwards}
@keyframes poopBurst{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:0}12%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--spin)) scale(1.1);opacity:0}}
main{max-width:900px;margin:0 auto;padding:22px 16px 36px}
header{background:var(--green);border:2px solid #f0b5ce;border-radius:24px;padding:23px;text-align:center}
.kicker{font-size:13px;font-weight:800;letter-spacing:.08em;color:#b34f7b}
h1{font-size:clamp(25px,5vw,36px);margin:5px 0}
header p{margin:0}
.counter{display:inline-block;margin-top:14px;padding:7px 13px;background:var(--gold);border:1px solid #f0b7d0;border-radius:99px;font-weight:800;font-size:14px}
.sheet{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:0 4px 0 #f4c7da}
.instructions{text-align:center;margin:0 0 16px;color:#6d7e70;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.broom{position:relative;min-height:115px;border:2px solid #8b603d;background:#b98253;border-radius:17px;padding:10px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink);cursor:pointer;transition:transform .12s,background .12s,border-color .12s}
.broom:not(.clean):hover{transform:translateY(-2px);border-color:#6f472c}
.broom:active{transform:scale(.97)}
.broom:focus-visible{outline:3px solid #e58ab3;outline-offset:3px}
.art{font-size:37px;line-height:1.2;position:relative;display:inline-block}
.broom:not(.clean) .art{filter:sepia(1) saturate(1.8) brightness(.78);transform:rotate(-7deg)}
.broom .dirt{position:absolute;font-size:20px;right:-13px;top:8px;transform:rotate(12deg);filter:grayscale(1);text-shadow:0 1px 1px #555;pointer-events:none;z-index:3}
.broom .mud2{position:absolute;font-size:18px;left:-13px;top:28px;transform:rotate(-25deg);filter:grayscale(1);opacity:.95;pointer-events:none;z-index:3}
.broom .mud3{position:absolute;font-size:20px;right:-13px;bottom:8px;transform:rotate(20deg);filter:none;z-index:3;pointer-events:none}
.num{font-size:12px;color:#fff3df;font-weight:800;line-height:1.25;overflow-wrap:anywhere;text-align:center}
.state{font-size:13px;font-weight:800}
.broom.clean{background:#8ed8ff;border-color:#269bd3}
.broom.clean .state{color:#075985}
.broom.clean .art{filter:saturate(1.12)}
.broom.clean .num{color:#075985}
.broom.clean .sparkle{position:absolute;top:-7px;right:-13px;font-size:19px}
.progress-label{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:900;color:#a44870;margin:0 2px 9px}
#percent{font-size:clamp(30px,6vw,48px);line-height:1;font-weight:1000;color:#c52d76;letter-spacing:-1px;text-shadow:0 2px 0 #ffd1e4}
.progress-wrap{height:24px;border:3px solid #ed9fc0;border-radius:99px;background:#ffe0ec;overflow:hidden;margin:0 0 18px;box-shadow:inset 0 2px 3px #f4bcd3}
.progress{height:100%;width:0;background:linear-gradient(90deg,#ff9fc5,#e83e8c);border-radius:99px;transition:width .25s}
.resetrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:17px}
.reset{border:2px solid #6b3d20;border-radius:12px;background:linear-gradient(180deg,#9a6035,#70401f);padding:10px 16px;color:#fff8e9;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #4d2b16;text-shadow:0 1px 1px #4d2b16}.reset:hover{background:linear-gradient(180deg,#ad7144,#80502b)}
footer{text-align:center;font-size:12px;color:#ad6685;margin-top:16px}
.clean-all{border:1px solid #1684bd;border-radius:12px;background:#2e9bd6;padding:10px 16px;color:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #1976a8}
.clean-all:focus-visible{outline:3px solid #e58ab3;outline-offset:3px}
.fireworks{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden;display:none}
.fireworks.show{display:block}
.firework-rocket{position:absolute;left:var(--sx);top:var(--sy);width:8px;height:27px;border-radius:60% 60% 45% 45%;background:linear-gradient(to bottom,#fff 0%,var(--color) 38%,#ff8a24 75%,#fff5a8 100%);box-shadow:0 0 9px 4px var(--color),0 10px 18px 2px #fff8;animation:rocketFly .9s cubic-bezier(.2,.7,.3,1) var(--delay,0s) forwards}
.firework-rocket:after{content:"";position:absolute;left:2px;top:20px;width:4px;height:38px;background:linear-gradient(#fff6a5,transparent);filter:blur(2px)}
@keyframes rocketFly{0%{transform:translate(0,0) rotate(var(--tilt)) scale(1);opacity:1}90%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--tilt)) scale(.45);opacity:0}}
.firework-spark{position:absolute;left:var(--bx);top:var(--by);width:6px;height:var(--len);border-radius:99px;background:linear-gradient(to bottom,#fff,var(--color) 45%,transparent);box-shadow:0 0 9px 2px var(--color);transform-origin:50% 0;animation:sparkFly 1.65s cubic-bezier(.12,.55,.22,1) var(--delay,0s) forwards}
@keyframes sparkFly{0%{transform:rotate(var(--angle)) translateY(0) scaleY(.3);opacity:1}70%{opacity:1}100%{transform:rotate(var(--angle)) translateY(var(--distance)) scaleY(.65);opacity:0}}
@media(prefers-reduced-motion:reduce){.firework-rocket,.firework-spark{animation:none;opacity:0}}
@media(prefers-reduced-motion:reduce){.celebration-card,.celebration-emoji,.confetti{animation:none}}
@media(max-width:560px){main{padding:12px 10px 25px}header,.sheet{padding:15px;border-radius:18px}.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.broom{min-height:78px;padding:5px 1px;border-radius:10px}.art{font-size:clamp(17px,5vw,27px)}.broom .dirt{font-size:12px;right:-5px;top:4px}.broom .mud2{font-size:11px;left:-5px;top:22px}.broom .mud3{font-size:12px;right:-5px;bottom:5px}.num{font-size:9px;line-height:1.15}.state{font-size:9px}}

</style>
</head>
<body>
<div class="background-dirt" id="backgroundDirt" aria-hidden="true"></div>
<main>
<header>
  <div class="kicker">매안초 우리반 · CLEANING TIME</div>
  <h1>🧹 1인1역 검사기</h1>
  <p>더러운 빗자루를 하나씩 눌러 깨끗하게 만들어 보자! 12개를 모두 완료하면 축하해 줄게!</p>
  <div class="counter" id="counter" aria-live="polite">깨끗한 빗자루 0 / 12개</div>
</header>
<section class="sheet">
  <p class="instructions">더러운 빗자루를 하나씩 눌러 봐! 깨끗해지면 파란색으로 바뀌어. 모두 12개를 완료하면 축하 파티가 열려!</p>
  <div class="progress-label"><span>오늘의 청소 진행률</span><span id="percent">0%</span></div>
  <div class="progress-wrap" aria-label="깨끗해진 빗자루 진행률"><div class="progress" id="progress"></div></div>
  <div class="grid" id="grid" aria-label="빗자루 12개"></div>
  <div class="resetrow"><button class="clean-all" id="cleanAll" type="button">✨ 모두 깨끗하게 하기</button><button class="reset" id="reset" type="button">💩 모두 더럽게 하기</button></div>
</section>
<footer>🌼 하나씩 깨끗하게, 우리 교실도 반짝반짝!</footer>
</main>
<div class="poop-flash" id="poopFlash" aria-hidden="true"></div>
<div class="fireworks" id="fireworks" aria-hidden="true"></div>
<!-- 실제 녹음 효과음: Wikimedia Commons (실제 방귀 녹음 / 실제 폭죽 녹음) -->
<audio id="fireworkAudio" preload="auto" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Fireworks.ogg"></audio>
<script>
(function(){
 const grid=document.getElementById('grid');
 const counter=document.getElementById('counter');
 const progress=document.getElementById('progress');
 const percent=document.getElementById('percent');
 const fireworks=document.getElementById('fireworks');
 const poopFlash=document.getElementById('poopFlash');
 const backgroundDirt=document.getElementById('backgroundDirt');
  const fireworkAudio=document.getElementById('fireworkAudio');
  function playRealSound(audio, limitMs){
    try{
      audio.pause();
      audio.currentTime=0;
      const promise=audio.play();
      if(promise && promise.catch) promise.catch(err=>console.warn('효과음을 재생하지 못했습니다:',err));
      if(limitMs) window.setTimeout(()=>{audio.pause();audio.currentTime=0;},limitMs);
    }catch(e){console.warn('효과음을 재생하지 못했습니다:',e);}
  }
 let poopTimer=null;
 const dirtSpots=[];
 // 회색 먼지는 여러 겹의 먼지 알갱이로, 똥은 화면 곳곳에 흩어 놓아요.
 const dirtLayout=[
   [12,18,'dust'],[76,20,'litter'],[89,35,'blacktrash'],
   [17,62,'poop'],[83,68,'dust'],[35,82,'litter'],
   [67,43,'blacktrash'],[91,86,'smoke'],[8,39,'smoke'],[48,12,'dust']
 ];
 const pollutionIcons={poop:'💩',litter:['🥤','🧴','🥫','🛍️','📦','🧻'],blacktrash:'🛢️',smoke:'🌫️'};
 dirtLayout.forEach(([x,y,type],i)=>{
   const spot=document.createElement('span');
   spot.className=type==='dust'?'dust-cloud':type==='poop'?'poop-mark':type==='smoke'?'smoke-mark':type==='blacktrash'?'oil-mark':'trash-mark';
   if(type==='litter') spot.textContent=pollutionIcons.litter[i%pollutionIcons.litter.length];
   else if(type!=='dust') spot.textContent=pollutionIcons[type];
   spot.style.left=x+'%';
   spot.style.top=y+'%';
   spot.style.transform=`rotate(${(i*47)%360}deg) scale(${.72+(i%4)*.12})`;
   backgroundDirt.appendChild(spot);
   dirtSpots.push(spot);
 });
 function showPoopFlash(){
    playPoopBurstSound();
   if(poopTimer) window.clearTimeout(poopTimer);
   poopFlash.innerHTML='';
   poopFlash.classList.add('show');
   // 똥 이모지가 아래에서 로켓처럼 날아오른 뒤 여러 방향으로 폭발!
   const launches=[12,29,46,63,80,94];
   launches.forEach((x,i)=>{
     const rocket=document.createElement('span');rocket.className='poop-rocket';rocket.textContent='💩';
     rocket.style.setProperty('--x',x+'%');rocket.style.setProperty('--height',(42+Math.random()*38)+'vh');
     rocket.style.setProperty('--drift',(-35+Math.random()*70)+'px');rocket.style.setProperty('--spin',(-240+Math.random()*480)+'deg');
     rocket.style.setProperty('--delay',(i*.09)+'s');
     rocket.addEventListener('animationend',()=>{
       const rect=rocket.getBoundingClientRect();const bx=Math.max(2,Math.min(94,rect.left/window.innerWidth*100));const by=Math.max(4,Math.min(80,rect.top/window.innerHeight*100));
       for(let j=0;j<13;j++){
         const poop=document.createElement('span');poop.className='poop-particle';poop.textContent='💩';
         poop.style.setProperty('--x',bx+'%');poop.style.setProperty('--y',by+'%');
         const angle=(Math.PI*2*j/13)+(Math.random()-.5)*.35;const distance=70+Math.random()*190;
         poop.style.setProperty('--dx',Math.cos(angle)*distance+'px');poop.style.setProperty('--dy',Math.sin(angle)*distance+'px');
         poop.style.setProperty('--spin',(-360+Math.random()*720)+'deg');poop.style.setProperty('--delay',(Math.random()*.12)+'s');
         poopFlash.appendChild(poop);
       }
       rocket.remove();
     },{once:true});
     poopFlash.appendChild(rocket);
   });
   poopTimer=window.setTimeout(()=>{poopFlash.classList.remove('show');poopFlash.innerHTML='';poopTimer=null;},3300);
 }
 const states=Array(12).fill(false);
 let celebrated=false;
 function showCelebration(){
   fireworks.innerHTML='';
   fireworks.classList.add('show');
   const colors=['#ff315f','#ffd52a','#38d9ff','#8bff65','#d17bff','#ff8b35','#ffffff','#ff66c4'];
   function burstAt(x,y){
     playFireworkBang(); // 불꽃이 화면에서 터지는 순간 크게 '펑!!!'
     const count=72;
     for(let i=0;i<count;i++){
       const spark=document.createElement('span');
       spark.className='firework-spark';
       spark.style.setProperty('--bx',x+'%');
       spark.style.setProperty('--by',y+'%');
       spark.style.setProperty('--color',colors[i%colors.length]);
       spark.style.setProperty('--angle',(i*(360/count)+Math.random()*5)+'deg');
       spark.style.setProperty('--len',(18+Math.random()*38)+'px');
       spark.style.setProperty('--distance',(100+Math.random()*210)+'px');
       spark.style.setProperty('--delay',(Math.random()*.12)+'s');
       fireworks.appendChild(spark);
     }
   }
   const launches=[{sx:5,sy:92,x:24,y:31,c:colors[0],d:0},{sx:95,sy:92,x:76,y:27,c:colors[1],d:.18},{sx:14,sy:94,x:39,y:43,c:colors[2],d:.48},{sx:86,sy:94,x:62,y:36,c:colors[3],d:.65},{sx:3,sy:92,x:31,y:20,c:colors[4],d:1.05},{sx:97,sy:92,x:70,y:18,c:colors[5],d:1.2}];
   launches.forEach(r=>{
     const rocket=document.createElement('span');rocket.className='firework-rocket';
     rocket.style.setProperty('--sx',r.sx+'%');rocket.style.setProperty('--sy',r.sy+'%');
     rocket.style.setProperty('--dx',(r.x-r.sx)+'vw');rocket.style.setProperty('--dy',(r.y-r.sy)+'vh');
     rocket.style.setProperty('--color',r.c);rocket.style.setProperty('--tilt',(r.sx<50?12:-12)+'deg');rocket.style.setProperty('--delay',r.d+'s');
     // 로켓이 날아오르는 순간마다 '슈우우웅~' 소리
     playFireworkWhoosh(r.d);
     rocket.addEventListener('animationend',()=>burstAt(r.x,r.y),{once:true});fireworks.appendChild(rocket);
   });
   window.setTimeout(()=>{fireworks.classList.remove('show');fireworks.innerHTML='';},5200);
 }
 function hideCelebration(){fireworks.classList.remove('show');fireworks.innerHTML='';}
 let audioContext=null;
 async function playSweepSound(){
   // 빗자루로 바닥을 쓱싹쓱싹 쓰는 소리를 세 번 이어서 재생합니다.
   try{
     const ctx=ensureAudioContext(); if(!ctx) return;
     [0,0.19,0.39].forEach((delay,index)=>{
       const duration=0.23, frames=Math.floor(ctx.sampleRate*duration);
       const buffer=ctx.createBuffer(1,frames,ctx.sampleRate), data=buffer.getChannelData(0);
       for(let i=0;i<frames;i++){
         const t=i/frames, envelope=Math.pow(Math.sin(Math.PI*t),0.7);
         data[i]=(Math.random()*2-1)*envelope*(0.8+0.2*Math.sin(t*32));
       }
       const src=ctx.createBufferSource(); src.buffer=buffer;
       const filter=ctx.createBiquadFilter(); filter.type='bandpass';
       filter.frequency.setValueAtTime(index%2===0?1500:1050,ctx.currentTime+delay);
       filter.frequency.exponentialRampToValueAtTime(index%2===0?550:420,ctx.currentTime+delay+duration);
       filter.Q.value=0.65;
       const gain=ctx.createGain();
       gain.gain.setValueAtTime(0.0001,ctx.currentTime+delay);
       gain.gain.exponentialRampToValueAtTime(0.7,ctx.currentTime+delay+0.025);
       gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+delay+duration);
       src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
       src.start(ctx.currentTime+delay); src.stop(ctx.currentTime+delay+duration);
     });
   }catch(e){console.warn('빗자루 소리를 재생하지 못했습니다:',e);}
 }

 function playCompletionSound(){
    // 실제 폭죽 소리에 팡팡 터지는 효과음을 더합니다.
    playRealSound(fireworkAudio, 6500);
    playFireworkPops();
  }

  function ensureAudioContext(){
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx) return null;
    if(!audioContext) audioContext=new AudioCtx();
    if(audioContext.state==='suspended') audioContext.resume().catch(()=>{});
    return audioContext;
  }

  function playFireworkWhoosh(delay=0){
    // 폭죽이 하늘로 날아갈 때 나는 길고 올라가는 '슈우우웅~' 소리
    try{
      const ctx=ensureAudioContext(); if(!ctx) return;
      const start=ctx.currentTime+delay, duration=0.82;
      const frames=Math.floor(ctx.sampleRate*duration);
      const buffer=ctx.createBuffer(1,frames,ctx.sampleRate), data=buffer.getChannelData(0);
      for(let i=0;i<frames;i++){
        const t=i/frames; data[i]=(Math.random()*2-1)*(0.25+0.75*Math.sin(Math.PI*t));
      }
      const noise=ctx.createBufferSource(); noise.buffer=buffer;
      const filter=ctx.createBiquadFilter(); filter.type='bandpass'; filter.Q.value=0.8;
      filter.frequency.setValueAtTime(450,start);
      filter.frequency.exponentialRampToValueAtTime(2400,start+duration*0.78);
      filter.frequency.exponentialRampToValueAtTime(1100,start+duration);
      const gain=ctx.createGain();
      gain.gain.setValueAtTime(0.0001,start);
      gain.gain.exponentialRampToValueAtTime(0.42,start+0.12);
      gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
      noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      noise.start(start); noise.stop(start+duration);
      // 고음이 살짝 섞여 로켓처럼 치솟는 느낌을 더함
      const tone=ctx.createOscillator(), toneGain=ctx.createGain(); tone.type='sine';
      tone.frequency.setValueAtTime(280,start); tone.frequency.exponentialRampToValueAtTime(1250,start+duration*0.8);
      toneGain.gain.setValueAtTime(0.0001,start); toneGain.gain.linearRampToValueAtTime(0.10,start+0.16);
      toneGain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
      tone.connect(toneGain); toneGain.connect(ctx.destination); tone.start(start); tone.stop(start+duration);
    }catch(e){console.warn('폭죽 발사 소리를 재생하지 못했습니다:',e);}
  }

  function playFireworkBang(){
    // 폭죽이 터지는 순간을 위해 날카로운 파열음 + 묵직한 저음 폭발음을 겹칩니다.
    try{
      const ctx=ensureAudioContext(); if(!ctx) return;
      const now=ctx.currentTime;
      // 날카로운 '팍!' 소리: 짧은 광대역 잡음
      const duration=0.34, frames=Math.floor(ctx.sampleRate*duration);
      const buffer=ctx.createBuffer(1,frames,ctx.sampleRate), data=buffer.getChannelData(0);
      for(let i=0;i<frames;i++){
        const t=i/frames;
        data[i]=(Math.random()*2-1)*Math.exp(-t*13)*(0.8+Math.random()*0.2);
      }
      const noise=ctx.createBufferSource(); noise.buffer=buffer;
      const crack=ctx.createBiquadFilter(); crack.type='highpass'; crack.frequency.value=650;
      const crackGain=ctx.createGain();
      crackGain.gain.setValueAtTime(0.0001,now);
      crackGain.gain.exponentialRampToValueAtTime(1.0,now+0.004);
      crackGain.gain.exponentialRampToValueAtTime(0.0001,now+duration);
      noise.connect(crack); crack.connect(crackGain); crackGain.connect(ctx.destination);
      noise.start(now); noise.stop(now+duration);
      // 묵직하고 긴 '펑!!!': 강한 저음과 바닥을 울리는 초저음을 겹칩니다.
      const boom=ctx.createOscillator(), boomGain=ctx.createGain();
      boom.type='sine';
      boom.frequency.setValueAtTime(105,now);
      boom.frequency.exponentialRampToValueAtTime(31,now+0.48);
      boomGain.gain.setValueAtTime(0.0001,now);
      boomGain.gain.exponentialRampToValueAtTime(1.35,now+0.008);
      boomGain.gain.exponentialRampToValueAtTime(0.0001,now+0.78);
      boom.connect(boomGain); boomGain.connect(ctx.destination);
      boom.start(now); boom.stop(now+0.80);

      // 깊은 초저음 '쿵!'이 폭발의 무게감을 더합니다.
      const sub=ctx.createOscillator(), subGain=ctx.createGain();
      sub.type='sine';
      sub.frequency.setValueAtTime(58,now);
      sub.frequency.exponentialRampToValueAtTime(25,now+0.36);
      subGain.gain.setValueAtTime(0.0001,now);
      subGain.gain.exponentialRampToValueAtTime(0.95,now+0.012);
      subGain.gain.exponentialRampToValueAtTime(0.0001,now+0.62);
      sub.connect(subGain); subGain.connect(ctx.destination);
      sub.start(now); sub.stop(now+0.64);

      // 낮게 울리는 폭발 잔향을 잡음으로 추가합니다.
      const rumbleFrames=Math.floor(ctx.sampleRate*0.58);
      const rumbleBuffer=ctx.createBuffer(1,rumbleFrames,ctx.sampleRate);
      const rumbleData=rumbleBuffer.getChannelData(0);
      for(let i=0;i<rumbleFrames;i++) rumbleData[i]=(Math.random()*2-1)*(1-i/rumbleFrames);
      const rumble=ctx.createBufferSource(); rumble.buffer=rumbleBuffer;
      const rumbleFilter=ctx.createBiquadFilter(); rumbleFilter.type='lowpass'; rumbleFilter.frequency.value=190;
      const rumbleGain=ctx.createGain();
      rumbleGain.gain.setValueAtTime(0.0001,now);
      rumbleGain.gain.exponentialRampToValueAtTime(0.72,now+0.012);
      rumbleGain.gain.exponentialRampToValueAtTime(0.0001,now+0.58);
      rumble.connect(rumbleFilter); rumbleFilter.connect(rumbleGain); rumbleGain.connect(ctx.destination);
      rumble.start(now); rumble.stop(now+0.59);

      // 아주 짧은 고음 충격음을 더해 터지는 느낌을 강조
      const snap=ctx.createOscillator(), snapGain=ctx.createGain();
      snap.type='triangle'; snap.frequency.setValueAtTime(950,now); snap.frequency.exponentialRampToValueAtTime(170,now+0.07);
      snapGain.gain.setValueAtTime(0.0001,now);
      snapGain.gain.exponentialRampToValueAtTime(0.55,now+0.003);
      snapGain.gain.exponentialRampToValueAtTime(0.0001,now+0.085);
      snap.connect(snapGain); snapGain.connect(ctx.destination);
      snap.start(now); snap.stop(now+0.09);
    }catch(e){console.warn('큰 폭죽 소리를 재생하지 못했습니다:',e);}
  }

  function playPoopBurstSound(){
    // 길게 울리고 떨리는 코믹한 “뿌우우우웅~” 효과음
    try{
      const ctx=ensureAudioContext(); if(!ctx) return;
      const now=ctx.currentTime, duration=1.55;
      const osc=ctx.createOscillator(); osc.type='sawtooth';
      osc.frequency.setValueAtTime(112,now);
      osc.frequency.exponentialRampToValueAtTime(66,now+0.28);
      osc.frequency.setValueAtTime(78,now+0.43);
      osc.frequency.exponentialRampToValueAtTime(48,now+duration);
      const wobble=ctx.createOscillator(); wobble.type='sine'; wobble.frequency.value=12;
      const wobbleGain=ctx.createGain(); wobbleGain.gain.value=15;
      wobble.connect(wobbleGain); wobbleGain.connect(osc.frequency);
      const filter=ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=360; filter.Q.value=2.5;
      const gain=ctx.createGain();
      gain.gain.setValueAtTime(0.0001,now);
      gain.gain.exponentialRampToValueAtTime(0.48,now+0.06);
      gain.gain.setValueAtTime(0.30,now+0.28);
      gain.gain.setValueAtTime(0.43,now+0.46);
      gain.gain.setValueAtTime(0.24,now+0.72);
      gain.gain.setValueAtTime(0.34,now+0.92);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+duration);
      osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      osc.start(now); wobble.start(now); osc.stop(now+duration); wobble.stop(now+duration);
    }catch(e){console.warn('뿌우우우웅 효과음을 재생하지 못했습니다:',e);}
  }

  function blendColor(a,b,t){
   const ah=a.replace('#',''), bh=b.replace('#','');
   const ar=parseInt(ah.slice(0,2),16), ag=parseInt(ah.slice(2,4),16), ab=parseInt(ah.slice(4,6),16);
   const br=parseInt(bh.slice(0,2),16), bg=parseInt(bh.slice(2,4),16), bb=parseInt(bh.slice(4,6),16);
   return '#'+[ar+(br-ar)*t,ag+(bg-ag)*t,ab+(bb-ab)*t].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
 }
 function paintProgress(done){
   // 버튼을 하나씩 청소할 때마다 갈색에서 파란색으로 변하고, 배경의 먼지도 순서대로 사라져요.
   const t=done/12;
   dirtSpots.forEach((spot,i)=>{spot.classList.toggle('gone', i < Math.round(t*dirtSpots.length));});
   const body=document.body, header=document.querySelector('header'), h1=document.querySelector('h1');
   const kicker=document.querySelector('.kicker'), counter=document.querySelector('.counter');
   const sheet=document.querySelector('.sheet'), label=document.querySelector('.progress-label');
   const pct=document.getElementById('percent'), wrap=document.querySelector('.progress-wrap');
   const bar=document.getElementById('progress'), footer=document.querySelector('footer');
   const set=(el,props)=>Object.entries(props).forEach(([k,v])=>el.style[k]=v);
   set(body,{backgroundColor:blendColor('#e3c09b','#72c8ff',t),color:blendColor('#68401f','#075985',t)});
   set(header,{backgroundColor:blendColor('#d5a879','#bfe8ff',t),borderColor:blendColor('#9b6b3e','#269bd3',t)});
   set(h1,{color:blendColor('#70431f','#005b96',t)});
   set(kicker,{color:blendColor('#70431f','#075985',t)});
   set(counter,{backgroundColor:blendColor('#f0d7b8','#dff4ff',t),borderColor:blendColor('#a87545','#269bd3',t),color:blendColor('#70431f','#075985',t)});
   set(sheet,{backgroundColor:blendColor('#f2dfc7','#eaf8ff',t),borderColor:blendColor('#c69a6c','#7bc9f2',t),boxShadow:`0 4px 0 ${blendColor('#d0ad84','#9edcff',t)}`});
   set(label,{color:blendColor('#70431f','#075985',t)});
   set(pct,{color:blendColor('#80502b','#005b96',t),textShadow:`0 2px 0 ${blendColor('#f8e7d1','#c7edff',t)}`});
   set(wrap,{borderColor:blendColor('#a87545','#269bd3',t),backgroundColor:blendColor('#ead0ae','#d7f0ff',t),boxShadow:`inset 0 2px 3px ${blendColor('#d7b48b','#a8def8',t)}`});
   bar.style.background=`linear-gradient(90deg,${blendColor('#c58b54','#64c7ff',t)},${blendColor('#80502b','#087cc1',t)})`;
   footer.style.color=blendColor('#70431f','#075985',t);
 }

 function render(){
   grid.innerHTML='';
   states.forEach((clean,i)=>{
     const b=document.createElement('button');
     b.type='button';
     b.className='broom'+(clean?' clean':'');
     b.setAttribute('aria-pressed',String(clean));
     b.setAttribute('aria-label',`빗자루 ${i+1}번, ${clean?'깨끗함':'더러움'}. 누르면 상태가 바뀝니다.`);
     const art=document.createElement('span');art.className='art';art.textContent='🧹';
     if(clean){const sparkle=document.createElement('span');sparkle.className='sparkle';sparkle.textContent='✨';art.append(sparkle);}
     const num=document.createElement('span');num.className='num';const cleaningNames=['교실 쓸기1 (칠판 앞)','교실 쓸기2 (교실 뒤)','교실 쓸기3 (1~3모둠)','교실 쓸기4 (4~6모둠)','교실 닦기 (1분단)','교실 닦기 (2분단)','교실 닦기 (3분단)','기타 닦기','우유 당번','우유 당번','종이쓰레기, 쓰레기통 비우기','종이쓰레기, 쓰레기통 비우기'];num.textContent=cleaningNames[i]||String(i+1);
     const label=document.createElement('span');label.className='state';label.textContent=clean?'✨ 깨끗해요':'● 더러워요';
     b.append(art,num,label);
     b.addEventListener('click',()=>{
       states[i]=!states[i];
       playSweepSound();
       render();
       const doneNow=states.filter(Boolean).length;
       document.body.classList.toggle('all-dirty',doneNow===0);
       if(doneNow===12&&!celebrated){
         celebrated=true;
         document.body.classList.add('all-done');
         showCelebration();
         playCompletionSound();
       }
       if(doneNow<12){
         celebrated=false;
         document.body.classList.remove('all-done');
         hideCelebration();
       }
       // 하나씩 눌러 12개를 모두 더럽게 되돌렸을 때 똥 효과 실행
       if(doneNow===0) showPoopFlash();
     });
     grid.append(b);
   });
   const done=states.filter(Boolean).length;
   counter.textContent=`깨끗한 빗자루 ${done} / 12개 · ${Math.round(done/12*100)}%`;
   progress.style.width=(done/12*100)+'%';
   percent.textContent=Math.round(done/12*100)+'%';
   paintProgress(done);
 }
 function completeAll(){
   if(states.every(Boolean)) return;
   states.fill(true);render();
   if(!celebrated){
     celebrated=true;document.body.classList.add('all-done');showCelebration();playCompletionSound();
   }
 }
 document.getElementById('cleanAll').addEventListener('click',()=>{completeAll();});
 document.getElementById('reset').addEventListener('click',()=>{states.fill(false);celebrated=false;document.body.classList.remove('all-done');document.body.classList.add('all-dirty');hideCelebration();render();showPoopFlash();});
 document.body.classList.add('all-dirty');
 render();
})();
</script>
